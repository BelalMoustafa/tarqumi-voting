<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترقمي - تصويت أفكار التطبيقات</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        :root {
            --primary-color: #000000;
            --bg-color: #f9f9f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header img {
            max-width: 200px;
            margin-bottom: 20px;
        }

        .header h1 {
            font-weight: 900;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            color: #666;
        }

        .counter-badge {
            background: var(--primary-color);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
        }

        .ideas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .idea-card {
            background: var(--card-bg);
            border: 2px solid #eee;
            border-radius: var(--border-radius);
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .idea-card:hover {
            border-color: #ccc;
            transform: translateY(-5px);
        }

        .idea-card.selected {
            border-color: var(--primary-color);
            background-color: #fafafa;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .idea-card h3 {
            margin-bottom: 10px;
            color: var(--primary-color);
            font-size: 1.2em;
        }

        .idea-card p {
            font-size: 0.95em;
            color: #555;
            line-height: 1.6;
        }

        /* Hide the actual checkbox */
        .idea-card input[type="checkbox"] {
            display: none;
        }

        .submit-container {
            text-align: center;
            margin: 40px 0;
        }

        .submit-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .submit-btn:hover {
            background-color: #333;
        }

        .submit-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>

<body>

    <div class="header">
        <img src="793037.jpg" alt="Tarqumi Logo">
        <h1>شاركنا رأيك في مشاريعنا القادمة</h1>
        <p>اختار أكتر 4 أفكار تطبيقات شايف إنها هتعمل ضجة ومحتاجينها فعلًا.</p>
        <div class="counter-badge" id="counter">تم اختيار: 0 / 4</div>
    </div>

    <form id="votingForm">
        <div class="ideas-grid" id="ideasGrid">
        </div>

        <div class="submit-container">
            <button type="submit" id="submitBtn" class="submit-btn" disabled>إرسال اختياراتي</button>
            <div id="message"></div>
        </div>
    </form>

    <script>
        // رابط جوجل سكريبت اللي طلعلك في الخطوة الأولى
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwMaXlBGkOC-UO2vEkE_8G2zUWAwVnVuPgfNSSc0TVpx0JyRl1b_kW0lwY_rV2hYBk/exec';

        const ideas = [
            {
                title: "صراحة بس بالصوت",
                desc: "تطبيق لإرسال رسائل صوتية مجهولة الهوية مع استخدام فلاتر لتغيير الصوت لضمان الخصوصية. <br><strong>مثال:</strong> شخص يبعت لصاحبه فويس نوت بصوت سنجاب يتريق عليه فيه، وصاحبه يعملها شير على ستوري انستجرام ويرد عليه."
            },
            {
                title: "عجلة الحظ للخروجات",
                desc: "أداة تفاعلية لحل مشكلة الحيرة في اختيار مكان الخروج، تختار مكان عشوائي بناءً على الميزانية. <br><strong>مثال:</strong> الشلة محتارة تروح فين، يفتحوا التطبيق ويحددوا ميزانية 200 جنيه، العجلة تلف وتطلع لهم 'قهوة في المعادي'."
            },
            {
                title: "تحدي الصحاب",
                desc: "تطبيق لتحويل الأهداف اليومية إلى لعبة تنافسية بين الأصدقاء مع نظام نقاط وعقوبات. <br><strong>مثال:</strong> تحدي بين 3 صحاب ينزلوا الجيم 4 أيام، اللي بيكسل التطبيق بيحكم عليه يعزم الباقيين على العشا."
            },
            {
                title: "هاتلي معاك",
                desc: "شبكة خدمات صغيرة داخل الأماكن المغلقة كالجامعات والشركات لطلب المساعدة البسيطة. <br><strong>مثال:</strong> طالب قاعد في المدرج بيكتب 'أنا نازل الكافتيريا'، زميله يطلب منه يجيبله قهوة وهو راجع ويحاسبه عليها."
            },
            {
                title: "AI Roast / Hype",
                desc: "تطبيق يستخدم الذكاء الاصطناعي لتحليل صورك وتقديم تعليقات ساخرة جداً أو مدح مبالغ فيه. <br><strong>مثال:</strong> ترفع سكرين شوت لبروفايلك على تويتر، والـ AI يكتبلك بوست يتريق فيه على كمية الدراما اللي بتكتبها وتاخده شير."
            },
            {
                title: "مين شبهك؟",
                desc: "تطبيق يقارن ملامحك بمشاهير أو شخصيات خيالية بطريقة ممتعة للركوب على التريند. <br><strong>مثال:</strong> ترفع صورتك، التطبيق يحللها ويقولك إنك شبه 'باتمان' بس على نسخة مصرية، وتشارك النتيجة."
            },
            {
                title: "لو كنت مكانه",
                desc: "منصة اجتماعية لعرض سيناريوهات ومواقف افتراضية للنقاش والتصويت على أفضل تصرف. <br><strong>مثال:</strong> التطبيق يعرض سؤال 'لو لقيت محفظة فيها 10 آلاف جنيه، هتعمل إيه؟' والناس تصوت وتتناقش في الكومنتات."
            },
            {
                title: "فضفضة",
                desc: "غرف صوتية ونصية آمنة ومجهولة الهوية لمشاركة الهموم والتجارب بدون الخوف من الأحكام المجتمعية. <br><strong>مثال:</strong> شاب بيمر بضغط في شغله، يدخل غرفة باسم مستعار يحكي مشكلته ويلاقي ناس بتدعمه."
            },
            {
                title: "اتقفشت",
                desc: "صانع ميمز تلقائي يحول الصور العفوية لأصدقائك إلى نكات جاهزة للمشاركة. <br><strong>مثال:</strong> تصور صاحبك وهو سرحان في المواصلات، التطبيق يكتب عليها تلقائياً 'لما تفتكر إنك نسيت تمسح الهيستوري'."
            },
            {
                title: "مين فاضي؟",
                desc: "خريطة اجتماعية لحظية تتيح لك معرفة المتاحين من أصدقائك في محيطك الجغرافي. <br><strong>مثال:</strong> تفتح التطبيق في الجامعة تلاقي صاحبك عامل حالة 'أنا فاضي وقاعد في الكافيتريا'، تروح تقعد معاه."
            },
            {
                title: "زنقة آخر الشهر",
                desc: "دليل للطلاب والشباب يقترح خيارات طعام وخروجات بأسعار اقتصادية، مع ميزة تقسيم الفواتير. <br><strong>مثال:</strong> الميزانية مخرمة ومعاك 50 جنيه بس، التطبيق يقولك على عربية كبدة قريبة منك ومكان تتمشى فيه ببلاش."
            },
            {
                title: "ذاكر معايا",
                desc: "غرف دراسة افتراضية حية تستخدم تقنية بومودورو لخلق بيئة محفزة تساعد الطلاب على التركيز. <br><strong>مثال:</strong> تدخل غرفة مع 5 طلاب تانيين، تذاكروا 25 دقيقة بتركيز تام وبعدين تاخدوا 5 دقايق بريك تتكلموا فيها."
            },
            {
                title: "حول كلامك لمسلسل",
                desc: "أداة ذكاء اصطناعي إبداعية تحول المواقف اليومية إلى مشاهد درامية أو كوميدية. <br><strong>مثال:</strong> تكتب 'اتخانقت مع سواق الميكروباص'، التطبيق يحولها لسيناريو فيلم أكشن هوليوودي فيه مطاردات."
            },
            {
                title: "AI صاحبك",
                desc: "صديق افتراضي مدعوم بالذكاء الاصطناعي، يمتلك شخصيات متعددة ويتحدث باللهجة المصرية. <br><strong>مثال:</strong> تختار شخصية 'الصاحب التوكسيك' وتقوله أنا مكتئب، يرد يقولك 'مكتئب إيه يا عم انزل هاتلي شاورما وروق'."
            },
            {
                title: "حاسبني",
                desc: "تطبيق مالي مبسط لمجموعات الأصدقاء لتسجيل وتقسيم المصاريف المشتركة بطريقة سلسة. <br><strong>مثال:</strong> الشلة طلعت الساحل، واحد دفع البنزين والتاني دفع الأكل، التطبيق بيحسب في الآخر كل واحد ليه كام وعليه كام."
            },
            {
                title: "ماذا لو؟",
                desc: "منصة تطرح سؤالاً افتراضياً يومياً لتحفيز الخيال وفتح باب النقاشات الممتعة. <br><strong>مثال:</strong> إشعار يومي بسؤال 'ماذا لو استيقظت وتستطيع قراءة الأفكار؟'، وتدخل تقرأ إجابات الناس المضحكة."
            },
            {
                title: "سعره كام؟",
                desc: "أداة ذكية تقدر أسعار المنتجات أو الأشياء في السوق المصري فور التقاط صورة لها. <br><strong>مثال:</strong> تشوف عربية مستعملة في الشارع عاجباك، تصورها، التطبيق يقولك 'دي كيا سيراتو موديل 2015 وسعرها التقريبي كذا'."
            },
            {
                title: "الدنيا زحمة؟",
                desc: "خريطة تفاعلية تعتمد على مشاركة المستخدمين لحالة الطرق والأماكن العامة في الوقت الفعلي. <br><strong>مثال:</strong> قبل ما تروح مول معين، تفتح التطبيق تلاقي ناس عاملة 'تشيك إن' وكاتبة 'المكان زحمة ومفيش ركنة'، فتغير خطتك."
            },
            {
                title: "إيه الأكلة؟",
                desc: "مساعد مطبخ ذكي يقترح وصفات طعام بناءً على الميزانية المتاحة أو المكونات الموجودة في ثلاجتك. <br><strong>مثال:</strong> تكتب للتطبيق 'عندي طماطم وبيض وبطاطس'، يقترحلك 3 أكلات مختلفة تقدر تعملهم بالمكونات دي."
            },
            {
                title: "لو الناس كانت صريحة",
                desc: "منصة كوميدية تولد الردود الحقيقية والصادمة التي يخفيها الناس في المواقف الاجتماعية. <br><strong>مثال:</strong> الموقف: 'صاحبك بيوريك لبس وحش'، الرد العادي: 'حلو عليك'، رد التطبيق الصريح: 'إنت شبه كيس الجوافة'."
            },
            {
                title: "اعترف",
                desc: "مساحة آمنة ومجهولة لكتابة الاعترافات والأسرار، مقسمة حسب المؤسسات كالجامعات. <br><strong>مثال:</strong> طالب يكتب اعتراف مجهول على بورد الجامعة 'أنا اللي وقعت القهوة على مشروع التخرج بتاع الدفعة'، والناس تتفاعل معاه."
            },
            {
                title: "مين يعرفني أكتر؟",
                desc: "لعبة اجتماعية تتيح لك إنشاء اختبار قصير عن تفضيلاتك ومشاركته مع أصدقائك. <br><strong>مثال:</strong> تعمل اختبار فيه أسئلة زي 'أكتر أكلة بكرهها؟'، وتبعته في جروب الواتساب، وتشوف مين هيجيب أعلى سكور."
            }
        ];
        const grid = document.getElementById('ideasGrid');
        const counterText = document.getElementById('counter');
        const submitBtn = document.getElementById('submitBtn');
        let selectedCount = 0;

        // Render Ideas
        ideas.forEach((idea, index) => {
            const card = document.createElement('label');
            card.className = 'idea-card';
            card.innerHTML = `
                <input type="checkbox" name="idea" value="${idea.title}">
                <h3>${index + 1}. ${idea.title}</h3>
                <p>${idea.desc}</p>
            `;
            grid.appendChild(card);

            const checkbox = card.querySelector('input');
            checkbox.addEventListener('change', function () {
                if (this.checked) {
                    if (selectedCount >= 4) {
                        this.checked = false; // Prevent checking more than 4
                        alert('لقد قمت باختيار 4 أفكار بالفعل!');
                        return;
                    }
                    selectedCount++;
                    card.classList.add('selected');
                } else {
                    selectedCount--;
                    card.classList.remove('selected');
                }
                updateCounter();
            });
        });

        function updateCounter() {
            counterText.innerText = `تم اختيار: ${selectedCount} / 4`;
            // Enable submit only if exactly 4 are selected
            if (selectedCount === 4) {
                submitBtn.disabled = false;
                counterText.style.background = '#28a745'; // Green when complete
            } else {
                submitBtn.disabled = true;
                counterText.style.background = 'var(--primary-color)';
            }
        }

        // Form Submit
        document.getElementById('votingForm').addEventListener('submit', function (e) {
            e.preventDefault();

            if (selectedCount !== 4) return;

            const checkboxes = document.querySelectorAll('input[name="idea"]:checked');
            let selectedValues = [];
            checkboxes.forEach(cb => selectedValues.push(cb.value));

            submitBtn.disabled = true;
            submitBtn.innerText = 'جاري الإرسال...';

            const formData = new URLSearchParams();
            formData.append('ideas', selectedValues.join(' | '));

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                body: formData,
                mode: 'no-cors' // Important to avoid CORS issues with Apps Script
            }).then(() => {
                document.getElementById('message').innerText = 'تم إرسال اختياراتك بنجاح! شكراً لمشاركتك.';
                document.getElementById('message').style.display = 'block';
                document.getElementById('message').style.color = '#28a745';
                submitBtn.innerText = 'تم الإرسال';
            }).catch(error => {
                document.getElementById('message').innerText = 'حدث خطأ أثناء الإرسال.';
                document.getElementById('message').style.display = 'block';
                document.getElementById('message').style.color = 'red';
                submitBtn.disabled = false;
                submitBtn.innerText = 'حاول مرة أخرى';
            });
        });
    </script>
</body>

</html>
