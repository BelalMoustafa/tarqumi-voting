<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترقمي - تصويت أفكار التطبيقات</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        :root {
            --primary-color: #000000;
            --bg-color: #f9f9f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header img {
            max-width: 200px;
            margin-bottom: 20px;
        }

        .header h1 {
            font-weight: 900;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            color: #666;
        }

        .counter-badge {
            background: var(--primary-color);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
        }

        .ideas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .idea-card {
            background: var(--card-bg);
            border: 2px solid #eee;
            border-radius: var(--border-radius);
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .idea-card:hover {
            border-color: #ccc;
            transform: translateY(-5px);
        }

        .idea-card.selected {
            border-color: var(--primary-color);
            background-color: #fafafa;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .idea-card h3 {
            margin-bottom: 10px;
            color: var(--primary-color);
            font-size: 1.2em;
        }

        .idea-card p {
            font-size: 0.95em;
            color: #555;
            line-height: 1.6;
        }

        /* Hide the actual checkbox */
        .idea-card input[type="checkbox"] {
            display: none;
        }

        .submit-container {
            text-align: center;
            margin: 40px 0;
        }

        .submit-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .submit-btn:hover {
            background-color: #333;
        }

        .submit-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>

<body>

    <div class="header">
        <img src="793037.jpg" alt="Tarqumi Logo">
        <h1>شاركنا رأيك في مشاريعنا القادمة</h1>
        <p>اختار أكتر 4 أفكار تطبيقات شايف إنها هتعمل ضجة ومحتاجينها فعلًا.</p>
        <div class="counter-badge" id="counter">تم اختيار: 0 / 4</div>
    </div>

    <form id="votingForm">
        <div class="ideas-grid" id="ideasGrid">
        </div>

        <div class="submit-container">
            <button type="submit" id="submitBtn" class="submit-btn" disabled>إرسال اختياراتي</button>
            <div id="message"></div>
        </div>
    </form>

    <script>
        // رابط جوجل سكريبت اللي طلعلك في الخطوة الأولى
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwMaXlBGkOC-UO2vEkE_8G2zUWAwVnVuPgfNSSc0TVpx0JyRl1b_kW0lwY_rV2hYBk/exec';
        const ideas = [
            {
                title: "صراحة بس بالصوت",
                desc: "تطبيق لإرسال رسائل صوتية مجهولة مع فلاتر ذكية لتغيير نبرة الصوت لضمان الخصوصية وإضافة طابع مرح.<br><strong>مثال:</strong> شخص يبعت فويس مجهول لصاحبه بصوت فضائي، وصاحبه يسمعه ويعمله شير ويرد عليه في ستوري."
            },
            {
                title: "عجلة الحظ للخروجات",
                desc: "أداة تفاعلية لحل جدل 'هنخرج فين؟' بتحديد مكان عشوائي بناءً على الميزانية وتفضيلات المجموعة.<br><strong>مثال:</strong> الشلة محتارة، يحددوا ميزانية متوسطة ونوع الخروجة (أكل ولا قهوة)، العجلة تلف وتختارلهم مكان معين يروحوه."
            },
            {
                title: "تحدي الصحاب",
                desc: "تطبيق لتحويل العادات اليومية لبيئة تنافسية بين الأصدقاء مع إمكانية تحديد شروط الفوز والخسارة والتارجت.<br><strong>مثال:</strong> تحدي بين صحاب على الالتزام بالصلاة أو الجيم، والتطبيق بيحسب مين التزم. تقدروا تظبطوا الرول إن 'أعلى واحد' الباقي يعزموه، أو 'أقل واحد' هو اللي يدفع حساب القهوة للكل."
            },
            {
                title: "هاتلي معاك",
                desc: "أداة لتنظيم الطلبات الجماعية والخدمات السريعة في بيئة العمل أو التجمعات، مع إدارة مالية مبسطة.<br><strong>مثال:</strong> حد في الشغل بيجمع أوردر فطار، بينزل المنيو ويحط رقم إنستاباي/المحفظة، والزملاء يختاروا طلباتهم، والتطبيق بيتابع مين حوّل ومين لسه والأوردر اكتمل ولا لأ."
            },
            {
                title: "AI Roast / Hype",
                desc: "تطبيق يستخدم الذكاء الاصطناعي لتحليل حسابات السوشيال ميديا وتقديم تعليقات نقدية لاذعة أو مدح مبالغ فيه.<br><strong>مثال:</strong> ترفع سكرين لبروفايلك، والـ AI يكتب تحليل ساخر جداً لأسلوبك في البوستات جاهز للشير."
            },
            {
                title: "مين شبهك؟",
                desc: "مقارنة دقيقة للملامح باستخدام الذكاء الاصطناعي لمعرفة شبيهك من المشاهير أو الشخصيات العامة.<br><strong>مثال:</strong> ترفع صورتك وصورة شخصية مشهورة، والتطبيق بيطلع نسبة الشبه بينكم بدقة مع كومنت ظريف."
            },
            {
                title: "لو كنت مكانه",
                desc: "منصة لعرض سيناريوهات ومواقف جدلية للنقاش والتصويت على القرار الأنسب أو رد الفعل المنطقي.<br><strong>مثال:</strong> سؤال بينزل 'لو جالك عرض شغل بضعف المرتب بس في بيئة توكسيك هتعمل إيه؟'، وتشوف تصويت الناس وآرائهم."
            },
            {
                title: "فضفضة",
                desc: "مساحة آمنة ومجهولة بالكامل لمشاركة التحديات والضغوطات اليومية سواء صوتياً أو نصياً.<br><strong>مثال:</strong> شخص مضغوط في شغله أو حياته، بيدخل غرفة دردشة مجهولة يتكلم بحرية ويسمع نصايح من أشخاص مروا بنفس التجربة."
            },
            {
                title: "اتقفشت",
                desc: "صانع ميمز ذكي يحلل الصور العفوية ويقترح تعليقات (Captions) كوميدية وتلقائية مناسبة للموقف.<br><strong>مثال:</strong> تصور صاحبك وهو نايم في الميتينج أو فاصل، الـ AI يركب عليها تعليق 'لما تحاول تستوعب التاسكات الجديدة'."
            },
            {
                title: "مين فاضي؟",
                desc: "خريطة تفاعلية لدوائر الأصدقاء توضح الأشخاص المتاحين حالياً للقاء سريع في نفس المنطقة.<br><strong>مثال:</strong> تفتح التطبيق تلاقي زميلك عامل حالة 'متاح لقهوة دلوقتي'، تبعتله وتتقابلوا من غير ترتيب مسبق."
            },
            {
                title: "زنقة آخر الشهر",
                desc: "دليل ذكي لاقتراح أماكن خروج ووجبات اقتصادية تناسب الميزانيات المحدودة.<br><strong>مثال:</strong> معاك مبلغ بسيط، التطبيق بيقترحلك أفضل مكان تاكل فيه أو نشاط تعمله بتكلفة قليلة جداً في منطقتك."
            },
            {
                title: "ذاكر معايا",
                desc: "غرف عمل ودراسة افتراضية تعتمد على تقنية بومودورو لزيادة الإنتاجية وتقليل التشتت.<br><strong>مثال:</strong> تدخل سيشن مع أشخاص من مجالات تانية، تشتغلوا بتركيز 25 دقيقة وبعدها بريك 5 دقايق تدردشوا فيها."
            },
            {
                title: "حول كلامك لمسلسل",
                desc: "أداة لتحويل المواقف اليومية المكتوبة إلى مشاهد درامية أو سينمائية قصيرة باستخدام الذكاء الاصطناعي.<br><strong>مثال:</strong> تكتب 'المدير رفض الإجازة'، التطبيق بيحولها لسيناريو مشهد تراجيدي أو أكشن."
            },
            {
                title: "AI صاحبك",
                desc: "شخصية افتراضية مبنية بالذكاء الاصطناعي تتفاعل معك بلهجة مصرية طبيعية وبشخصيات مختلفة.<br><strong>مثال:</strong> تختار شخصية 'الناصح'، وتتناقش معاه في قرار محير، وبيرد عليك بأسلوب واقعي وعملي كأنه صاحبك."
            },
            {
                title: "حاسبني",
                desc: "أداة لتبسيط إدارة المصروفات المشتركة بين الأصدقاء وتصفية الحسابات بدقة وسرعة.<br><strong>مثال:</strong> في سفرية، شخص بيدفع الإقامة والتاني البنزين، التطبيق بيحسب التوتال ويقول كل شخص يدفع كام لمين بخطوة واحدة."
            },
            {
                title: "ماذا لو؟",
                desc: "طرح سؤال افتراضي يومي يستفز الخيال ويخلق مساحة لنقاشات مجتمعية ممتعة بعيداً عن روتين السوشيال ميديا.<br><strong>مثال:</strong> سؤال اليوم: 'ماذا لو أصبحت الإنترنت متاحة ساعة واحدة يومياً؟'، وتتابع إجابات المستخدمين."
            },
            {
                title: "سعره كام؟",
                desc: "تسعير تقريبي للأشياء والمنتجات في السوق المحلي بمجرد التقاط صورة لها.<br><strong>مثال:</strong> تصور لابتوب أو جهاز معين قدامك، التطبيق بيتعرف عليه ويقولك متوسط سعره التقريبي حالياً في مصر."
            },
            {
                title: "الدنيا زحمة؟",
                desc: "تحديثات لحظية مبنية على تقارير المستخدمين لمعرفة حالة الزحام في الأماكن العامة والطرق.<br><strong>مثال:</strong> قبل ما تروح تخلص ورق من مصلحة حكومية أو بنك، تشوف تقارير الناس اللي هناك حالياً عشان تتجنب الزحمة."
            },
            {
                title: "إيه الأكلة؟",
                desc: "مساعد ذكي لابتكار وصفات طعام بناءً على المكونات المتاحة فعلياً في مطبخك.<br><strong>مثال:</strong> تكتب المكونات اللي في التلاجة، والتطبيق بيديك وصفة متكاملة بخطوات التحضير من غير ما تشتري حاجة من بره."
            },
            {
                title: "لو الناس كانت صريحة",
                desc: "توليد ردود فعل صادمة ومباشرة للمواقف التي تتطلب مجاملات اجتماعية.<br><strong>مثال:</strong> الموقف: 'مديرك بيطلب شغل في الويك إند'، التطبيق بيطلعلك الرد الصريح اللي نفسك تقوله بس مش هتقدر."
            },
            {
                title: "اعترف",
                desc: "منصة آمنة لمشاركة الاعترافات والأفكار دون الكشف عن الهوية، مقسمة حسب المجتمعات أو الشركات.<br><strong>مثال:</strong> موظف بيكتب اعتراف مجهول عن موقف محرج حصل في الشغل في بورد مخصص لشركته، وبيشوف تفاعل الباقيين."
            },
            {
                title: "مين يعرفني أكتر؟",
                desc: "اختبارات شخصية مخصصة تقيس مدى معرفة أصدقائك أو زملائك بتفاصيلك وتفضيلاتك.<br><strong>مثال:</strong> تعمل كويز عن أكتر مواقف بتعصبك أو تفضيلاتك في الأكل وتبعته لصحابك، وتشوف مين فيهم هيجاوب صح."
            }
        ];
        const grid = document.getElementById('ideasGrid');
        const counterText = document.getElementById('counter');
        const submitBtn = document.getElementById('submitBtn');
        let selectedCount = 0;

        // Render Ideas
        ideas.forEach((idea, index) => {
            const card = document.createElement('label');
            card.className = 'idea-card';
            card.innerHTML = `
                <input type="checkbox" name="idea" value="${idea.title}">
                <h3>${index + 1}. ${idea.title}</h3>
                <p>${idea.desc}</p>
            `;
            grid.appendChild(card);

            const checkbox = card.querySelector('input');
            checkbox.addEventListener('change', function () {
                if (this.checked) {
                    if (selectedCount >= 4) {
                        this.checked = false; // Prevent checking more than 4
                        alert('لقد قمت باختيار 4 أفكار بالفعل!');
                        return;
                    }
                    selectedCount++;
                    card.classList.add('selected');
                } else {
                    selectedCount--;
                    card.classList.remove('selected');
                }
                updateCounter();
            });
        });

        function updateCounter() {
            counterText.innerText = `تم اختيار: ${selectedCount} / 4`;
            // Enable submit only if exactly 4 are selected
            if (selectedCount === 4) {
                submitBtn.disabled = false;
                counterText.style.background = '#28a745'; // Green when complete
            } else {
                submitBtn.disabled = true;
                counterText.style.background = 'var(--primary-color)';
            }
        }

        // Form Submit
        document.getElementById('votingForm').addEventListener('submit', function (e) {
            e.preventDefault();

            if (selectedCount !== 4) return;

            const checkboxes = document.querySelectorAll('input[name="idea"]:checked');
            let selectedValues = [];
            checkboxes.forEach(cb => selectedValues.push(cb.value));

            submitBtn.disabled = true;
            submitBtn.innerText = 'جاري الإرسال...';

            const formData = new URLSearchParams();
            formData.append('ideas', selectedValues.join(' | '));

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                body: formData,
                mode: 'no-cors' // Important to avoid CORS issues with Apps Script
            }).then(() => {
                document.getElementById('message').innerText = 'تم إرسال اختياراتك بنجاح! شكراً لمشاركتك.';
                document.getElementById('message').style.display = 'block';
                document.getElementById('message').style.color = '#28a745';
                submitBtn.innerText = 'تم الإرسال';
            }).catch(error => {
                document.getElementById('message').innerText = 'حدث خطأ أثناء الإرسال.';
                document.getElementById('message').style.display = 'block';
                document.getElementById('message').style.color = 'red';
                submitBtn.disabled = false;
                submitBtn.innerText = 'حاول مرة أخرى';
            });
        });
    </script>
</body>

</html>
