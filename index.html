<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترقمي - تصويت أفكار التطبيقات</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        :root {
            --primary-color: #000000;
            --bg-color: #f9f9f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header img {
            max-width: 200px;
            margin-bottom: 20px;
        }

        .header h1 {
            font-weight: 900;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            color: #666;
        }

        .counter-badge {
            background: var(--primary-color);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
        }

        .ideas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .idea-card {
            background: var(--card-bg);
            border: 2px solid #eee;
            border-radius: var(--border-radius);
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .idea-card:hover {
            border-color: #ccc;
            transform: translateY(-5px);
        }

        .idea-card.selected {
            border-color: var(--primary-color);
            background-color: #fafafa;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .idea-card h3 {
            margin-bottom: 10px;
            color: var(--primary-color);
            font-size: 1.2em;
        }

        .idea-card p {
            font-size: 0.95em;
            color: #555;
            line-height: 1.6;
        }

        /* Hide the actual checkbox */
        .idea-card input[type="checkbox"] {
            display: none;
        }

        .submit-container {
            text-align: center;
            margin: 40px 0;
        }

        .submit-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .submit-btn:hover {
            background-color: #333;
        }

        .submit-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>

<body>

    <div class="header">
        <img src="793037.jpg" alt="Tarqumi Logo">
        <h1>شاركنا رأيك في مشاريعنا القادمة</h1>
        <p>اختار أكتر 4 أفكار تطبيقات شايف إنها هتعمل ضجة ومحتاجينها فعلًا.</p>
        <div class="counter-badge" id="counter">تم اختيار: 0 / 4</div>
    </div>

    <form id="votingForm">
        <div class="ideas-grid" id="ideasGrid">
        </div>

        <div class="submit-container">
            <button type="submit" id="submitBtn" class="submit-btn" disabled>إرسال اختياراتي</button>
            <div id="message"></div>
        </div>
    </form>

    <script>
        // رابط جوجل سكريبت اللي طلعلك في الخطوة الأولى
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwMaXlBGkOC-UO2vEkE_8G2zUWAwVnVuPgfNSSc0TVpx0JyRl1b_kW0lwY_rV2hYBk/exec';
        const ideas = [
            {
                title: "صراحة بس بالصوت",
                desc: "ابلكيشن بتبعت عليه رسايل صوتية مجهولة، وفيه فلاتر بتغير نبرة الصوت عشان محدش يعرفك والموضوع يبقى كوميدي.<br><strong>مثال:</strong> واحد يبعت فويس لصاحبه وهو مغير صوته لصوت فضائي يتريق عليه، وصاحبه يسمعه ويعمله شير ويرد عليه."
            },
            {
                title: "عجلة الحظ للخروجات",
                desc: "عجلة بتلفها تختارلك هتروح فين وتعمل إيه مع صحابك عشان تنهي حيرة كل خروجة.<br><strong>مثال:</strong> الشلة محتارة تروح فين، يفتحوا الابلكيشن ويحددوا ميزانية 200 جنيه، العجلة تلف وتطلع لهم 'قهوة في المعادي'."
            },
            {
                title: "تحدي الصحاب",
                desc: "بتعمل تحديات بينك وبين صحابك زي الجيم أو الصلاة، وبتحددوا قواعد للي بيكسب واللي بيخسر.<br><strong>مثال:</strong> تحدي صلاة بين الشلة، الابلكيشن بيحسب مين ملتزم، وممكن تظبطوا إن أعلى واحد الباقي يعزموه، أو أقل واحد يعملهم حاجة معينة."
            },
            {
                title: "هاتلي معاك",
                desc: "فكرة بتسهل الطلبات في الشغل أو الجامعة. حد بيكتب إنه نازل يجيب أكل وبيحط الاختيارات، والباقي بيطلب وهو بيجمع الأوردر ويحسب الحسابات.<br><strong>مثال:</strong> واحد في الشغل نازل يجيب فطار، بيحط منيو الفول والطعمية ورقم إنستاباي.. زمايله بيختاروا، والابلكيشن بيجمع الأوردر كله ويقوله مين دفع ومين لسه."
            },
            {
                title: "AI Roast / Hype",
                desc: "ابلكيشن ذكاء اصطناعي بترفع عليه صورتك أو بروفايلك، وهو يتريق عليك تريقة جامدة أو يمدحك أوي عشان تركب التريند.<br><strong>مثال:</strong> ترفع سكرين لبروفايلك، والـ AI يكتبلك بوست يتريق فيه على كلامك وصورك وتاخده شير تضحك مع صحابك."
            },
            {
                title: "مين شبهك؟",
                desc: "بترفع صورتك والابلكيشن بيشوفك شبه مين من الممثلين أو الشخصيات المشهورة بالذكاء الاصطناعي.<br><strong>مثال:</strong> ترفع صورتك وصورة ممثل، والابلكيشن يقولك نسبة الشبه بينكم بدقة مع كومنت ظريف."
            },
            {
                title: "لو كنت مكانه",
                desc: "ابلكيشن كله سيناريوهات ومواقف، والناس بتدخل تتناقش وتصوت هيعملوا إيه لو كانوا في نفس الموقف.<br><strong>مثال:</strong> ينزل سؤال 'لو جالك شغل بمرتب خيالي بس مع مدير توكسيك هتعمل إيه؟'، والناس تصوت وتشوف آراء بعض."
            },
            {
                title: "فضفضة",
                desc: "رومات صوتية ونصية من غير أسماء، الناس بتدخل تفضفض فيها عن مشاكلها والضغوطات بتاعتها من غير ما حد يحكم عليهم.<br><strong>مثال:</strong> حد مضغوط في حياته، بيدخل روم باسم مستعار يتكلم براحته ويسمع نصايح من ناس حاسة بيه."
            },
            {
                title: "اتقفشت",
                desc: "صانع ميمز بيخليك تصور صحابك صور غفلة، والـ AI يركب عليها كابشن مضحك تلقائي.<br><strong>مثال:</strong> تصور صاحبك وهو نايم في المواصلات، الابلكيشن يكتب عليها لوحده 'لما تفتكر إنك متأخر على الشغل'."
            },
            {
                title: "مين فاضي؟",
                desc: "خريطة لايف بتعرفك مين من صحابك أو دفعتك قريب منك وفاضي دلوقتي ينزل يخرج معاك بدل ما تقعد تكلمهم واحد واحد.<br><strong>مثال:</strong> قاعد زهقان، بتفتح الابلكيشن تلاقي صاحبك عامل حالته 'أنا فاضي وقاعد على القهوة اللي تحت'، فتنزل تقعد معاه على طول."
            },
            {
                title: "زنقة آخر الشهر",
                desc: "ابلكيشن بيقترحلك أكل وخروجات رخيصة جداً وتقسيم فلوس ومناسب للطلاب والشباب في آخر الشهر.<br><strong>مثال:</strong> الميزانية مخرمة ومعاك 50 جنيه بس، الابلكيشن يقولك على عربية كبدة قريبة منك ومكان تتمشى فيه ببلاش."
            },
            {
                title: "ذاكر معايا",
                desc: "غرف مذاكرة وشغل لايف بتدخل فيها مع ناس تانية عشان تشجعوا بعض، بتظبطوا وقت معين تركزوا فيه ووقت للبريك.<br><strong>مثال:</strong> بتدخل روم مع 5 كمان، تظبطوا التايمر إنكم هتذاكروا نص ساعة بتركيز من غير ما حد يمسك الموبايل، وبعدين تاخدوا 5 دقايق بريك تدردشوا فيها."
            },
            {
                title: "حول كلامك لمسلسل",
                desc: "منصة الناس بتكتب أو بتسجل فيها مواقف وأفكار حصلت معاهم، والمؤلفين الحقيقيين بيختاروا أحسن القصص دي عشان يحطوها في مسلسلات بجد.<br><strong>مثال:</strong> حصل معاك موقف غريب جداً في الميكروباص، بتدخل تحكيه على الابلكيشن، مؤلف يشوفه يعجبه وياخده يكتبه مشهد في مسلسله الجديد وينزل اسمك."
            },
            {
                title: "AI صاحبك",
                desc: "شخصية ذكاء اصطناعي بتتكلم معاك باللهجة المصرية كأنها صاحبك بجد، وممكن تختار شخصيته (جدع، توكسيك، إلخ).<br><strong>مثال:</strong> تختار شخصية 'الصاحب الناصح' وتحكيله مشكلة، يرد عليك بأسلوب واقعي كأنه قاعد معاك على القهوة."
            },
            {
                title: "حاسبني",
                desc: "ابلكيشن بيظبط حسابات الشلة، بيحسب مين دفع إيه ومين عليه كام في الخروجات أو السفر بطريقة سهلة.<br><strong>مثال:</strong> طلعتوا الساحل، واحد دفع البنزين والتاني دفع الأكل، الابلكيشن بيحسب التوتال ويقول كل واحد يدفع كام لمين."
            },
            {
                title: "ماذا لو؟",
                desc: "كل يوم بينزل سؤال خيالي جديد للناس كلها، وتدخل تشوف إجابات بعض وتتناقشوا بطريقة لذيذة.<br><strong>مثال:</strong> سؤال اليوم: 'ماذا لو اختفى الإنترنت بكرة؟'، وتدخل تقرأ إجابات الناس الكوميدية."
            },
            {
                title: "سعره كام؟",
                desc: "بتصور أي حاجة قدامك والذكاء الاصطناعي بيقولك سعرها التقريبي في السوق المصري.<br><strong>مثال:</strong> تشوف عربية مستعملة أو لابتوب، تصوره، الابلكيشن يقولك 'دي كيا سيراتو وسعرها التقريبي كذا'."
            },
            {
                title: "الدنيا زحمة؟",
                desc: "خريطة تفاعلية الناس بتعمل فيها Check-in عشان يقولوا المكان اللي هما فيه زحمة ولا رايق.<br><strong>مثال:</strong> قبل ما تروح مول أو بنك، تفتح الابلكيشن تلاقي ناس كاتبة 'المكان هنا زحمة جداً ومفيش ركنة'، فتأجل مشوارك."
            },
            {
                title: "إيه الأكلة؟",
                desc: "بتكتب المكونات اللي عندك في التلاجة، والابلكيشن بيقترحلك وصفات أكل تقدر تعملها بيهم من غير ما تشتري حاجة.<br><strong>مثال:</strong> تكتب للتطبيق 'عندي طماطم وبيض وبطاطس'، يطلعلك 3 أكلات مختلفة تقدر تعملهم وتتعشى."
            },
            {
                title: "لو الناس كانت صريحة",
                desc: "ابلكيشن كوميدي بيطلع الردود الحقيقية اللي الناس بتخبيها في المواقف اللي فيها مجاملات.<br><strong>مثال:</strong> الموقف: 'صاحبك بيوريك طقم جديد وحش'، الرد العادي: 'شيك يا صاحبي'، رد الابلكيشن: 'إنت شبه كيس الجوافة'."
            },
            {
                title: "اعترف",
                desc: "مكان بتكتب فيه اعترافات أو أسرار من غير ما حد يعرفك، وبتبقى متقسمة على حسب جامعتك أو منطقتك.<br><strong>مثال:</strong> طالب يكتب اعتراف مجهول على بورد الجامعة 'أنا اللي بوظت بروجيكت التخرج'، والناس تدخل تتفاعل وتضحك."
            },
            {
                title: "مين يعرفني أكتر؟",
                desc: "لعبة بتعمل فيها امتحان صغير عن نفسك وتبعته لصحابك تشوف مين فيهم هيجاوب صح ويجيب أعلى سكور.<br><strong>مثال:</strong> تعمل كويز فيه سؤال 'إيه أكتر أكلة بكرهها؟'، وتبعته على جروب الواتساب وتشوف مين اللي عارفك بجد."
            }
        ];
        const grid = document.getElementById('ideasGrid');
        const counterText = document.getElementById('counter');
        const submitBtn = document.getElementById('submitBtn');
        let selectedCount = 0;

        // Render Ideas
        ideas.forEach((idea, index) => {
            const card = document.createElement('label');
            card.className = 'idea-card';
            card.innerHTML = `
                <input type="checkbox" name="idea" value="${idea.title}">
                <h3>${index + 1}. ${idea.title}</h3>
                <p>${idea.desc}</p>
            `;
            grid.appendChild(card);

            const checkbox = card.querySelector('input');
            checkbox.addEventListener('change', function () {
                if (this.checked) {
                    if (selectedCount >= 4) {
                        this.checked = false; // Prevent checking more than 4
                        alert('لقد قمت باختيار 4 أفكار بالفعل!');
                        return;
                    }
                    selectedCount++;
                    card.classList.add('selected');
                } else {
                    selectedCount--;
                    card.classList.remove('selected');
                }
                updateCounter();
            });
        });

        function updateCounter() {
            counterText.innerText = `تم اختيار: ${selectedCount} / 4`;
            // Enable submit only if exactly 4 are selected
            if (selectedCount === 4) {
                submitBtn.disabled = false;
                counterText.style.background = '#28a745'; // Green when complete
            } else {
                submitBtn.disabled = true;
                counterText.style.background = 'var(--primary-color)';
            }
        }

        // Form Submit
        document.getElementById('votingForm').addEventListener('submit', function (e) {
            e.preventDefault();

            if (selectedCount !== 4) return;

            const checkboxes = document.querySelectorAll('input[name="idea"]:checked');
            let selectedValues = [];
            checkboxes.forEach(cb => selectedValues.push(cb.value));

            submitBtn.disabled = true;
            submitBtn.innerText = 'جاري الإرسال...';

            const formData = new URLSearchParams();
            formData.append('ideas', selectedValues.join(' | '));

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                body: formData,
                mode: 'no-cors' // Important to avoid CORS issues with Apps Script
            }).then(() => {
                document.getElementById('message').innerText = 'تم إرسال اختياراتك بنجاح! شكراً لمشاركتك.';
                document.getElementById('message').style.display = 'block';
                document.getElementById('message').style.color = '#28a745';
                submitBtn.innerText = 'تم الإرسال';
            }).catch(error => {
                document.getElementById('message').innerText = 'حدث خطأ أثناء الإرسال.';
                document.getElementById('message').style.display = 'block';
                document.getElementById('message').style.color = 'red';
                submitBtn.disabled = false;
                submitBtn.innerText = 'حاول مرة أخرى';
            });
        });
    </script>
</body>

</html>
